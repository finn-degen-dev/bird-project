services:
  bird-ai:
    build: .
    container_name: bird_container_gpu
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    env_file:
      - .env
    command: tail -f /dev/null
    shm_size: '6gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
